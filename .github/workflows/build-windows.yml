name: Build Windows App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies (Electron + builder)
        run: npm install --no-audit --no-fund

      - name: Install client dependencies
        run: npm --prefix client install --no-audit --no-fund

      - name: Install server dependencies
        run: npm --prefix server install --no-audit --no-fund

      - name: Build client and server
        run: npm run build

      - name: Remove stray self-reference from server package.json (npm --prefix quirk)
        run: npm --prefix server pkg delete dependencies.voice-messenger

      - name: Remove server dev dependencies before packaging
        run: npm --prefix server prune --omit=dev

      - name: Bake Neon DATABASE_URL into the package (repo secret NEON_DATABASE_URL)
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        shell: pwsh
        run: |
          $url = if ($env:NEON_DATABASE_URL) { $env:NEON_DATABASE_URL.Trim() } else { '' }
          $enc = New-Object System.Text.UTF8Encoding($false) # UTF-8 без BOM
          if ($url) {
            [IO.File]::WriteAllText("$PWD/voice-messenger.env", "DATABASE_URL=$url`n", $enc)
            Write-Host "Baked DATABASE_URL into voice-messenger.env (host: $(([Uri]$url).Host))"
          } else {
            [IO.File]::WriteAllText("$PWD/voice-messenger.env", "# DATABASE_URL is not configured (add repo secret NEON_DATABASE_URL)`n", $enc)
            Write-Host "NEON_DATABASE_URL secret is not set - package ships without built-in database (users can add it in Settings)"
          }

      - name: Build Windows executables (installer + portable)
        run: npx electron-builder --win nsis portable --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (kept 30 days)
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMessenger-Windows-x64
          path: release/*.exe
          if-no-files-found: error

      - name: Attach executables to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
